name: Build

# Manual run (builds only), or push a version tag to build AND publish a Release
# with direct-download links:  git tag v0.1.0 && git push origin v0.1.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# The release job needs write access to create the GitHub Release.
permissions:
  contents: write

jobs:
  windows:
    name: Windows (portable .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Spout/NDI sidecar is packaged with PyInstaller
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build sidecar + app
        run: |
          npm run build:sidecar
          npm run build

      # package.json sets directories.output to ../LiveForgeExe (outside the
      # checkout), which upload-artifact can't reach — override it to a path
      # inside the workspace for CI.
      - name: Package portable exe
        run: npx electron-builder --win portable --publish never --config.directories.output=release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: LiveForge-windows-portable
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg — no Spout/NDI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci   # rebuilds @julusian/midi, koffi, serialport for macOS

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      # Uses electron-builder.mac.yml (x64 + arm64 dmgs, no sidecar). Spout/NDI
      # widgets are disabled on macOS; everything else works. Unsigned build.
      - name: Package dmgs (Intel + Apple Silicon)
        run: npx electron-builder --mac --publish never --config electron-builder.mac.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no Apple cert → skip signing

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: LiveForge-macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  # On a version tag, gather the built binaries and publish a GitHub Release
  # with direct-download links (no login / no Actions navigation needed).
  release:
    name: Publish Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
